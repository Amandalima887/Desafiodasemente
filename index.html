<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5a28">
<title>Desafio das Sementes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4efe4;--card:#fffdf7;--tx:#1d2a1e;--mu:#6c7769;--ac:#2f7d3a;--acd:#1e5a28;--ac2:#e5f1e0;--bd:#e5ddcb;--gold:#c98f0b;--gold2:#fbf0d3;--yel:#d8a10c;--red:#c0392b;--red2:#fbe3df;--sh:0 1px 2px #0000000d,0 8px 24px #2a3a1f14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10150f;--card:#1a2219;--tx:#eef3ec;--mu:#9aa797;--ac:#6fcf76;--acd:#3f9a48;--ac2:#22311f;--bd:#2c382a;--gold:#e8b443;--gold2:#3a3016;--yel:#e8c04a;--red:#ef6b5c;--red2:#3d1f1b;--sh:none}}
:root[data-theme="dark"]{--bg:#10150f;--card:#1a2219;--tx:#eef3ec;--mu:#9aa797;--ac:#6fcf76;--acd:#3f9a48;--ac2:#22311f;--bd:#2c382a;--gold:#e8b443;--gold2:#3a3016;--yel:#e8c04a;--red:#ef6b5c;--red2:#3d1f1b;--sh:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font-family:inherit}
/* topo */
.hero{background:linear-gradient(155deg,#174a20 0%,#2f7d3a 55%,#62a955 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 52px;position:relative;overflow:hidden}
.hero::after{content:"🌾 🌱 🌿 🌱 🌾 🌱";position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:20px;letter-spacing:14px;opacity:.22}
body.lider .hero{background:linear-gradient(155deg,#12381a 0%,#245f2e 60%,#3f8a45 100%)}
body.lider .hero::after{display:none}
.hero-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
body.lider .hero-in,body.lider .wrap{max-width:780px}
.hero h1{font-family:Fraunces,Georgia,serif;font-size:27px;line-height:1.1;margin:0}
.hero .sub{opacity:.85;font-size:13px;margin-top:4px}
.hbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.me,.live{background:#ffffff24;border:1px solid #ffffff45;color:#fff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer}
.live{cursor:default;font-size:12.5px}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CFC8a;margin-right:6px;animation:pulse 1.6s infinite}
.live.off i{background:#ffb4a8;animation:none}
@keyframes pulse{50%{opacity:.3}}
.wrap{max-width:560px;margin:-34px auto 0;padding:0 14px calc(90px + env(safe-area-inset-bottom));position:relative}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.lbl{font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.bar{height:12px;background:var(--ac2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acd),var(--ac));border-radius:99px;transition:width .6s}
.warn{background:#fff3cd;color:#5c4400;border-radius:14px;padding:12px;font-size:14px;margin-bottom:14px}
/* escolha de nome */
.pick{text-align:center}
.pick .ic{font-size:52px;line-height:1}
.pick h2,.pin h2{font-family:Fraunces,Georgia,serif;margin:6px 0 2px;font-size:24px}
.grp{text-align:left;margin:18px 0 8px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names button{padding:13px 10px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-weight:700;cursor:pointer;text-align:left}
.names button:active{background:var(--ac2);border-color:var(--ac)}
.leader{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;border:1px dashed var(--bd);background:transparent;color:var(--tx);font-size:15px;font-weight:800;cursor:pointer;text-align:left}
.leader span.i{font-size:24px}
/* senha */
.pin{text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ac);transition:background .15s}
.dots i.on{background:var(--ac)}
.dots.bad{animation:shake .4s}.dots.bad i{border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pad button{height:62px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:24px;font-weight:800;cursor:pointer}
.pad button:active{background:var(--ac2)}
.pad button.ghost{border:0;background:none;font-size:15px;color:var(--mu)}
/* planta e semana */
.plant{display:flex;align-items:center;gap:16px}
.pot{flex:none;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 50% 70%,var(--ac2) 0 58%,transparent 60%);display:grid;place-items:center;font-size:60px;animation:sway 4s ease-in-out infinite;transform-origin:50% 85%}
@keyframes sway{50%{transform:rotate(-5deg)}}
.big{font-family:Fraunces,Georgia,serif;font-size:38px;font-weight:800;color:var(--ac);line-height:1}
.stg{font-weight:900;font-size:17px;margin:2px 0}
.jr{display:flex;justify-content:space-between;position:relative;margin-top:12px}
.jr::before{content:"";position:absolute;left:20px;right:20px;top:20px;height:4px;background:var(--bd);border-radius:4px}
.jr button{position:relative;z-index:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--mu);font-size:12px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.jr .dot{width:40px;height:40px;border-radius:50%;background:var(--card);border:3px solid var(--bd);display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--tx);transition:transform .2s}
.jr .part .dot{border-color:var(--ac)}
.jr .full .dot{background:var(--gold);border-color:var(--gold);color:#fff}
.jr .on{color:var(--tx)}
.jr .on .dot{transform:scale(1.15);box-shadow:0 0 0 5px var(--ac2)}
.jr .lock{opacity:.45}
.wk{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring .arc{animation:draw .9s ease-out}
@keyframes draw{from{stroke-dasharray:0 326.7}}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.rc .e{font-size:28px}.rc b{font-size:20px;color:var(--ac)}
.card.full{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold),var(--sh)}
.seeds{display:flex;justify-content:space-between;font-size:19px;margin:12px 0 4px}
.seeds span{opacity:.16;filter:grayscale(1);transition:all .3s}
.seeds span.on{opacity:1;filter:none}
.seeds span.n{animation:grow .6s}
.act{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;margin-top:8px;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font-size:15px;font-weight:700;text-align:left;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;transition:background .2s,border-color .2s,transform .1s}
.act:active{transform:scale(.98)}
.act .chk{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ac2);display:grid;place-items:center;font-size:20px;transition:all .2s}
.act .tx{flex:1}
.act .pt{font-size:13px;font-weight:900;color:var(--mu);white-space:nowrap}
.act.done{background:var(--ac2);border-color:var(--ac)}
.act.done .chk{background:var(--ac);color:#fff;font-weight:900}
.act.done .pt{color:var(--ac)}
.act.pop .chk{animation:grow .5s}
@keyframes grow{0%{transform:scale(.2)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.fl{position:absolute;right:50px;font-style:normal;font-weight:900;color:var(--ac);animation:fl 1s forwards;pointer-events:none}
@keyframes fl{to{opacity:0;transform:translateY(-34px)}}
.rec{margin-top:14px;padding:12px;border-radius:16px;border:1px dashed var(--bd)}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{min-width:52px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-weight:900;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.prize{display:flex;gap:12px;align-items:center;background:var(--gold2);border-radius:16px;padding:12px;margin-top:12px;font-size:14px}
.prize .g{font-size:30px}
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:12px 0 8px;padding:12px 10px 16px;border-radius:16px;background:linear-gradient(180deg,transparent 40%,#8a5a2b26)}
.field span{font-size:25px;text-align:center;line-height:38px;border-radius:50%}
.field span.mine{background:var(--ac2);box-shadow:0 0 0 2px var(--ac)}
.lock-msg{text-align:center;padding:24px 16px}
/* painel do líder */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:5px;margin-bottom:14px;box-shadow:var(--sh)}
.tabs button{flex:1;padding:10px 6px;border:0;border-radius:12px;background:none;color:var(--tx);font-size:14px;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13.5px;font-weight:700;cursor:pointer}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:620px){.kp{grid-template-columns:1fr 1fr}}
.kp>div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px;box-shadow:var(--sh);font-size:13px}
.kp b{display:block;font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1.1;color:var(--ac)}
.kp .y b{color:var(--yel)}.kp .r b{color:var(--red)}
.row{margin:11px 0}.row .h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.row .bar{height:11px;margin:5px 0 0}
.vbars{display:flex;gap:8px;height:170px;margin-top:12px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.vb .t{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--ac2);border-radius:10px;overflow:hidden}
.vb .t i{display:block;width:100%;background:linear-gradient(0deg,var(--acd),var(--ac));border-radius:10px 10px 0 0;transition:height .5s}
.vb.cur .t{outline:2px solid var(--gold);outline-offset:1px}
.vb b{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{width:36px;font-weight:900}
tr.top td{background:var(--gold2)}
.scroll{overflow-x:auto}
.search{width:100%;padding:12px 14px;font-size:16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
.st{cursor:pointer}
.st .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.sp{display:flex;gap:5px;align-items:flex-end;height:44px;margin:12px 0 4px}
.sp i{flex:1;border-radius:5px 5px 0 0;background:var(--bd)}
.sp i.g{background:var(--ac)}.sp i.y{background:var(--yel)}.sp i.r{background:var(--red)}
.sn{display:flex;gap:5px}.sn span{flex:1;text-align:center;font-size:11px;color:var(--mu);line-height:1.25}.sn b{color:var(--tx);font-size:13px}
.ai{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;margin-right:3px;font-size:14px;background:var(--bd);opacity:.45;filter:grayscale(1)}
.ai.on{background:var(--ac2);opacity:1;filter:none;box-shadow:inset 0 0 0 1.5px var(--ac)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--red2);color:var(--red)}
.btn{width:100%;padding:13px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px}
.prz{background:var(--gold2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
/* efeitos */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acd);color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}.toast.err{background:var(--red)}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf i{position:absolute;top:-24px;width:10px;height:14px;border-radius:2px;font-style:normal;font-size:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.cfb{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--card);color:var(--ac);padding:20px 26px;border-radius:20px;font-size:21px;font-weight:900;z-index:51;box-shadow:0 10px 40px #0006;text-align:center;pointer-events:none}
.loading{text-align:center;padding:40px 0;font-size:40px;animation:sway 1.2s infinite}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div><h1 id="ttl">🌱 Desafio das Sementes</h1><div class="sub" id="sub">Tenda do Encontro · Módulo 1 · 7 semanas · meta: 10 sementes por semana</div></div>
  <div class="hbtns"><span class="live off" id="live" style="display:none"><i></i></span><button class="me" id="who" style="display:none"></button></div>
</div></header>
<div class="wrap"><div id="warn"></div><main id="app"><div class="loading">🌱</div></main></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== CONFIGURAÇÃO ===================== */
const CFG = {
  url: "https://uosqhsidxtsxkgotldca.supabase.co",
  key: "sb_publishable_BngeHh_HWKuDoK1Ccy1dEA_j_hXUMua",
  tabela: "desafio_sementes",
  codigoLider: "2810",
  // Data da 1ª semana (AAAA-MM-DD). Com data: semanas futuras ficam bloqueadas
  // e o painel abre direto na semana atual. Vazio = todas liberadas.
  inicio: ""
};
const PESSOAS = [
  ["seg","alexandre-oliva","Alexandre Oliva"],["seg","carolina-gomes","Carolina Gomes"],["seg","daniel-alves","Daniel Alves"],
  ["seg","dayana-alvarenga","Dayana Alvarenga"],["seg","deyse","Deyse"],["seg","diogo","Diogo"],["seg","diogo-alves","Diogo Alves"],
  ["seg","j-rodrigues","J. Rodrigues"],["seg","julia-bomboni","Julia Bomboni"],["seg","juliana-pinho","Juliana Pinho"],
  ["seg","karen","Karen"],["seg","katia","Katia"],["seg","marcela-alves","Marcela Alves"],["seg","nandinha","Nandinha"],
  ["seg","gabriel","Gabriel"],["seg","thamires","Thamires"],["seg","yasmin","Yasmin"],["seg","samuel","Samuel"],["seg","leony","Leony"],
  ["sab","cinthia","Cinthia"],["sab","debora","Debora"],["sab","fagner","Fagner"],["sab","patricia","Patricia"],
  ["sab","suellen","Suellen"],["sab","vanessa","Vanessa"],["sab","larissa","Larissa"]
];
const ACT = [["🎥","Assistir às aulas"],["🤝","Participar do encontro ao vivo"],["📖","Fazer a leitura bíblica"],["✍️","Realizar a atividade proposta"],["✅","Concluir a entrega ou prática"]];
const PR = ["Livro de até R$ 50","Kit Surpresa Tenda","Acesso à aula de quarta-feira do Módulo 2","1 entrada para o Encontro","Acesso à aula de quarta-feira do Módulo 2","Um livro complementar","Um caderno PROFÉTICO"];
const STAGES = [[0,"🌰","Semente"],[2,"🌱","Broto"],[14,"🌿","Muda"],[28,"🪴","Planta jovem"],[42,"🌳","Árvore"],[60,"🍎","Árvore frutífera"]];
const WEMO = ["🌰","🌰","🌱","🌱","🌿","🌿","🪴","🪴","🌳","🌳","🏆"];
/* ======================================================== */

const W=[1,2,3,4,5,6,7];
const ST=PESSOAS.map(([t,s,n])=>({id:t+"_"+s,n,t:t==="seg"?"Segunda":"Sábado"}));
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const f1=n=>(Math.round(n*10)/10).toLocaleString("pt-BR");
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

let sb=null,data={},upd={},lastSave={},ready=false,ok=false,lastUpd=null;
let mode="pick",me=ls.get("sementes_me"),pinTxt="";
if(ls.get("sementes_lider")==="1")mode="lider";else if(me)mode="aluna";
// aluna
let wk=null,pop=-1,party=false;
// líder
let gView="O",refWk=null,fT="Todas",rWk="geral",q="",sO="n",open=null;

const get=id=>data[id]||{};
const mk=(id,w)=>String(get(id)["e"+w]||"00000").padEnd(5,"0").slice(0,5);
const base=(id,w)=>[...mk(id,w)].filter(c=>c!=="0").length*2;
const rmax=b=>b>=7&&b<10?10-b:0;
const rec=(id,w)=>Math.min(+(get(id)["r"+w]||0),rmax(base(id,w)));
const pts=(id,w)=>Math.min(10,base(id,w)+rec(id,w));
const tot=id=>W.reduce((s,w)=>s+pts(id,w),0);
const stage=t=>STAGES.filter(x=>x[0]<=t).pop();
const started=id=>W.some(w=>pts(id,w)>0);
const avg=(l,w)=>l.length?l.reduce((a,s)=>a+pts(s.id,w),0)/l.length:0;
const cls=p=>p>=8?"g":p>=5?"y":"r";
function semanaAtual(){
  if(!CFG.inicio)return null;
  const d=Math.floor((Date.now()-new Date(CFG.inicio+"T00:00:00-03:00").getTime())/864e5);
  return d<0?0:Math.min(7,Math.floor(d/7)+1);
}
const locked=w=>{const sa=semanaAtual();return sa!==null&&w>sa};
const lastActive=()=>W.filter(w=>ST.some(s=>base(s.id,w)>0)).pop()||1;

function toast(msg,err){const t=$("toast");t.textContent=msg;t.className="toast on"+(err?" err":"");clearTimeout(t._h);t._h=setTimeout(()=>t.className="toast"+(err?" err":""),err?3000:1300)}

/* ===================== NAVEGAÇÃO ===================== */
function go(m){mode=m;window.scrollTo(0,0);render()}
function header(){
  const who=$("who"),live=$("live");
  document.body.classList.toggle("lider",mode==="lider");
  $("ttl").textContent=mode==="lider"?"🌱 Painel do Líder":"🌱 Desafio das Sementes";
  $("sub").textContent=mode==="lider"?"Desafio das Sementes · Tenda do Encontro · acompanhamento das turmas":"Tenda do Encontro · Módulo 1 · 7 semanas · meta: 10 sementes por semana";
  live.style.display=mode==="lider"?"":"none";
  if(mode==="lider"){
    live.className="live"+(ok?"":" off");
    live.innerHTML=`<i></i>${ok?"ao vivo":"offline"}${lastUpd?" · "+lastUpd.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):""}`;
    who.style.display="";who.textContent="Sair";
    who.onclick=()=>{ls.del("sementes_lider");go(me?"aluna":"pick")};
  }else if(mode==="aluna"){
    const s=ST.find(x=>x.id===me);
    who.style.display="";who.textContent="👤 "+s.n.split(" ")[0]+" · trocar";
    who.onclick=()=>{if(!confirm("Trocar de nome neste aparelho?"))return;me=null;ls.del("sementes_me");go("pick")};
  }else who.style.display="none";
}
function render(){
  if(mode==="aluna"&&!ST.find(x=>x.id===me)){me=null;mode="pick"}
  header();
  if(mode==="pin")return renderPin();
  if(mode==="pick")return renderPick();
  if(!ready)return;
  if(mode==="lider")return renderLider();
  renderAluna();
}

/* ===================== ESCOLHA DE NOME ===================== */
function renderPick(){
  $("app").innerHTML=`<section class="card pick"><div class="ic">🌱</div><h2>Quem é você?</h2>
  <div class="mu">Toque no seu nome. Este aparelho vai lembrar de você nas próximas vezes.</div>
  ${["Segunda","Sábado"].map(t=>`<div class="grp lbl">Turma de ${t.toLowerCase()}</div><div class="names">${ST.filter(s=>s.t===t).map(s=>`<button data-me="${s.id}">${s.n}</button>`).join("")}</div>`).join("")}</section>
  <button class="leader" id="goLider"><span class="i">🔐</span><span>Líder do projeto<br><span class="mu" style="font-weight:600">Acesso ao painel de acompanhamento</span></span></button>`;
  document.querySelectorAll("[data-me]").forEach(b=>b.onclick=()=>{
    const s=ST.find(x=>x.id===b.dataset.me);
    if(!confirm(`Confirmar: você é ${s.n} (turma de ${s.t.toLowerCase()})?`))return;
    me=s.id;ls.set("sementes_me",me);wk=null;go("aluna");
  });
  $("goLider").onclick=()=>{pinTxt="";go("pin")};
}

/* ===================== CÓDIGO DO LÍDER ===================== */
function renderPin(){
  $("app").innerHTML=`<section class="card pin"><div style="font-size:46px">🔐</div><h2>Líder do projeto</h2>
  <div class="mu">Digite o código de 4 números</div>
  <div class="dots" id="dots">${[0,1,2,3].map(i=>`<i class="${i<pinTxt.length?"on":""}"></i>`).join("")}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="ghost" id="pinBack">Voltar</button><button data-n="0">0</button><button class="ghost" id="pinDel">⌫</button></div></section>`;
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>pinKey(b.dataset.n));
  $("pinDel").onclick=()=>{pinTxt=pinTxt.slice(0,-1);renderPin()};
  $("pinBack").onclick=()=>{pinTxt="";go(me?"aluna":"pick")};
}
function pinKey(n){
  if(pinTxt.length>=4)return;
  pinTxt+=n;renderPin();
  if(pinTxt.length<4)return;
  if(pinTxt===CFG.codigoLider){ls.set("sementes_lider","1");pinTxt="";setTimeout(()=>go("lider"),150)}
  else{const d=$("dots");d.classList.add("bad");if(navigator.vibrate)navigator.vibrate(120);setTimeout(()=>{pinTxt="";renderPin()},600)}
}
document.addEventListener("keydown",e=>{if(mode!=="pin")return;if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace"){pinTxt=pinTxt.slice(0,-1);renderPin()}});

/* ===================== PAINEL DA PARTICIPANTE ===================== */
async function salvar(){
  const id=me;lastSave[id]=Date.now();
  try{
    const {error}=await sb.from(CFG.tabela).update({dados:get(id)}).eq("id",id);
    if(error)throw error;
    toast("Salvo ✓");
  }catch(e){toast("⚠️ Não salvou. Confira a internet e toque de novo.",true)}
}

function renderAluna(){
  const s=ST.find(x=>x.id===me),sa=semanaAtual();
  if(wk===null)wk=sa?sa:(W.filter(w=>base(me,w)>0).pop()||1);
  const T=tot(me),sg=stage(T),nx=STAGES.find(x=>x[0]>T);
  let h=`<section class="card"><div class="plant"><div class="pot">${sg[1]}</div><div style="flex:1;min-width:0">
    <div class="lbl">Meu jardim</div><div class="big">${T}<span class="mu" style="font-size:15px;font-family:Nunito"> / 70 sementes</span></div>
    <div class="stg">${sg[2]}</div><div class="mu">${nx?`Faltam ${nx[0]-T} para virar ${nx[2]} ${nx[1]}`:"Você chegou ao topo! 🎉"}</div></div></div>
    <div class="bar"><i style="width:${T/70*100}%"></i></div>
    <div class="jr">${W.map(w=>{const p=pts(me,w),l=locked(w);return `<button data-w="${w}" class="${w===wk?"on":""} ${p===10?"full":p>0?"part":""} ${l?"lock":""}"><span class="dot">${l?"🔒":p===10?"🏆":p}</span>S${w}</button>`}).join("")}</div></section>`;

  if(sa===0){
    h+=`<section class="card lock-msg"><div style="font-size:44px">🌰</div><b>O desafio ainda não começou</b><div class="mu">Começa em ${new Date(CFG.inicio+"T12:00:00").toLocaleDateString("pt-BR")}. Volte nesse dia para plantar suas primeiras sementes!</div></section>`;
  }else if(locked(wk)){
    h+=`<section class="card lock-msg"><div style="font-size:44px">🔒</div><b>Semana ${wk} ainda não abriu</b><div class="mu">Ela libera quando chegar a hora. Foque na semana ${sa}! 🌱</div></section>`;
  }else{
    const b=base(me,wk),r=rec(me,wk),p=pts(me,wk),m=mk(me,wk),rm=rmax(b);
    h+=`<section class="card ${p===10?"full":""}"><div class="wk">
      <div class="ring"><svg viewBox="0 0 120 120" width="112" height="112"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ac2)" stroke-width="12"/>
      <circle class="arc" cx="60" cy="60" r="52" fill="none" stroke="${p===10?"var(--gold)":"var(--ac)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${p/10*326.7} 326.7" transform="rotate(-90 60 60)"/></svg>
      <div class="rc"><span class="e">${WEMO[p]}</span><b>${p}<span class="mu">/10</span></b></div></div>
      <div><div class="lbl">Semana ${wk}${sa===wk?" · atual":""}</div><div style="font-weight:900;font-size:18px;line-height:1.2;margin:2px 0">${p===10?"Semana completa! 🎉":p===0?"Bora plantar? 🌰":`Faltam ${10-p} sementes`}</div>
      <div class="mu">Atividades: ${b}${r?` · leitura: +${r}`:""}</div></div></div>
      <div class="seeds">${Array.from({length:10},(_,k)=>`<span class="${k<p?"on":""} ${pop>=0&&k<p&&k>=p-2?"n":""}">🌱</span>`).join("")}</div>
      <div class="mu" style="margin-top:6px">Toque em cada atividade que você cumpriu para plantar sua semente (+2). Toque de novo para desfazer.</div>
      ${ACT.map((a,i)=>{const d=m[i]!=="0";return `<button class="act ${d?"done":""} ${pop===i?"pop":""}" data-i="${i}"><span class="chk">${d?"✓":a[0]}</span><span class="tx">${a[1]}</span><span class="pt">${d?"🌱 +2":"+2"}</span>${pop===i?'<em class="fl">+2 🌱</em>':""}</button>`}).join("")}
      <div class="rec"><b>📖 Recuperação por leitura complementar</b>
      <div class="mu" style="margin-top:4px">${rm?`Você está com ${b} sementes nas atividades. Leia o livro complementar e recupere até +${rm}.`:b>=10?"Você fechou a semana sem precisar de recuperação. 💪":"Libera quando você chegar a 8 sementes nas atividades (falta só 1 atividade)."}</div>
      ${rm?`<div class="seg">${Array.from({length:rm+1},(_,k)=>`<button data-rc="${k}" class="${k===r?"on":""}">+${k}</button>`).join("")}</div>`:""}</div>
      <div class="prize"><span class="g">🎁</span><div><div class="lbl">Prêmio da semana ${wk}</div><b>${PR[wk-1]}</b></div></div></section>`;
  }

  const tm=ST.filter(x=>x.t===s.t),soma=tm.reduce((a,x)=>a+tot(x.id),0),fw=sa||wk,cheios=tm.filter(x=>pts(x.id,fw)===10).length;
  h+=`<section class="card"><div class="lbl">🌳 Jardim da turma de ${s.t.toLowerCase()}</div>
    <div style="font-weight:900;font-size:18px;margin-top:4px">${soma} sementes plantadas juntos</div>
    <div class="bar"><i style="width:${soma/(tm.length*70)*100}%"></i></div>
    <div class="field">${tm.map(x=>`<span class="${x.id===me?"mine":""}">${stage(tot(x.id))[1]}</span>`).join("")}</div>
    <div class="mu">Cada planta é uma pessoa da turma; a sua está destacada. ${cheios?`${cheios} já ${cheios>1?"fecharam":"fechou"} 10/10 na semana ${fw}! 🏆`:"Quem vai ser a primeira a fechar 10/10 esta semana?"}</div></section>`;
  h+=`<section class="card"><div class="lbl">🏅 Grande prêmio</div><div style="margin-top:6px;font-size:15px">Ao fim das 7 semanas, quem tiver mais sementes ganha <b>50% de desconto</b>, e o 2º lugar ganha <b>50% para presentear alguém</b>.</div></section>`;

  $("app").innerHTML=h;
  if(party&&pts(me,wk)===10)confetti();
  pop=-1;party=false;

  document.querySelectorAll(".jr button").forEach(b=>b.onclick=()=>{wk=+b.dataset.w;render()});
  document.querySelectorAll(".act[data-i]").forEach(c=>c.onclick=()=>{
    const i=+c.dataset.i,before=pts(me,wk),d={...get(me)},a=mk(me,wk).split("");
    a[i]=a[i]!=="0"?"0":"1";d["e"+wk]=a.join("");data[me]=d;
    const nb=base(me,wk);if(+(d["r"+wk]||0)>rmax(nb))d["r"+wk]=rmax(nb);
    pop=a[i]==="1"?i:-1;party=before<10&&pts(me,wk)===10;
    if(navigator.vibrate&&pop>=0)navigator.vibrate(25);
    salvar();render();
  });
  document.querySelectorAll("[data-rc]").forEach(c=>c.onclick=()=>{
    const before=pts(me,wk),d={...get(me)};d["r"+wk]=+c.dataset.rc;data[me]=d;
    party=before<10&&pts(me,wk)===10;salvar();render();
  });
}

function confetti(){
  const c=["#2f7d3a","#c98f0b","#e91e63","#2196f3","#ff9800","#9c27b0"],box=document.createElement("div");box.className="cf";
  for(let i=0;i<70;i++){const s=document.createElement("i"),g=Math.random()<.35;s.textContent=g?"🌱":"";
    s.style.cssText=`left:${Math.random()*100}%;background:${g?"transparent":c[i%6]};animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;--dx:${(Math.random()-.5)*160}px`;box.appendChild(s)}
  const b=document.createElement("div");b.className="cfb";b.innerHTML="🎉 Semana completa!<br>10/10 sementes 🌳";
  document.body.append(box,b);setTimeout(()=>{box.remove();b.remove()},3600);
}

/* ===================== PAINEL DO LÍDER ===================== */
const ref=()=>refWk||semanaAtual()||lastActive();
const fil=()=>ST.filter(s=>fT==="Todas"||s.t===fT);
function rowBar(l,v,max,txt){return `<div class="row"><div class="h"><span>${l}</span><b>${txt}</b></div><div class="bar"><i style="width:${max?Math.min(100,v/max*100):0}%"></i></div></div>`}

function renderLider(){
  if(gView==="A"&&document.activeElement&&document.activeElement.id==="sq"){listA();return}
  const tabs=`<div class="tabs">${[["O","📊 Visão geral"],["A","👥 Alunas"],["R","🏆 Ranking"]].map(([k,l])=>`<button data-v="${k}" class="${k===gView?"on":""}">${l}</button>`).join("")}</div>`;
  const turma=`<div class="chips">${["Todas","Segunda","Sábado"].map(t=>`<button data-t="${t}" class="${t===fT?"on":""}">${t==="Todas"?"Todas as turmas":"Turma de "+t.toLowerCase()}</button>`).join("")}</div>`;
  const sem=`<div class="chips">${W.map(w=>`<button data-rw="${w}" class="${w===ref()?"on":""}">Semana ${w}${w===semanaAtual()?" •":""}</button>`).join("")}</div>`;
  $("app").innerHTML=tabs+turma+(gView!=="R"?sem:"")+`<div id="v"></div>`;
  ({O:vO,A:vA,R:vR})[gView]();
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{gView=b.dataset.v;render()});
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{fT=b.dataset.t;render()});
  document.querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>{refWk=+b.dataset.rw;render()});
}

function vO(){
  const r=ref(),L=fil(),n=L.length;
  const reg=L.filter(s=>started(s.id)).length,full=L.filter(s=>pts(s.id,r)===10).length;
  const el=Math.max(1,semanaAtual()||lastActive());
  const ad=n?Math.round(L.reduce((a,s)=>a+W.slice(0,el).reduce((b,w)=>b+pts(s.id,w),0),0)/(n*10*el)*100):0;
  const c={g:0,y:0,r:0};L.forEach(s=>c[cls(pts(s.id,r))]++);
  let h=`<div class="kp"><div><span class="mu">Já começaram</span><b>${reg}/${n}</b></div><div><span class="mu">Média na semana ${r}</span><b>${f1(avg(L,r))}</b></div><div><span class="mu">Fecharam 10/10 (S${r})</span><b>${full}</b></div><div><span class="mu">Aderência até S${el}</span><b>${ad}%</b></div></div>`;
  h+=`<div class="kp"><div><span class="mu">🟢 Em dia (8+)</span><b>${c.g}</b></div><div class="y"><span class="mu">🟡 Atenção (5 a 7)</span><b>${c.y}</b></div><div class="r"><span class="mu">🔴 Risco (0 a 4)</span><b>${c.r}</b></div><div><span class="mu">🎁 Prêmio S${r}</span><div style="font-weight:800;font-size:13.5px;margin-top:4px">${PR[r-1]}</div></div></div>`;
  h+=`<div class="card"><div class="lbl">Evolução semanal · média de sementes</div><div class="vbars">${W.map(w=>{const v=avg(L,w);return `<div class="vb ${w===r?"cur":""}"><b>${f1(v)}</b><div class="t"><i style="height:${v*10}%"></i></div><span class="mu">S${w}</span></div>`}).join("")}</div></div>`;
  if(fT==="Todas")h+=`<div class="card"><div class="lbl">Comparativo das turmas · semana ${r}</div>${["Segunda","Sábado"].map(t=>{const l=ST.filter(s=>s.t===t);return rowBar(`Turma de ${t.toLowerCase()} (${l.length})`,avg(l,r),10,f1(avg(l,r))+"/10")}).join("")}</div>`;
  const kr=L.filter(s=>rec(s.id,r)>0).length;
  h+=`<div class="card"><div class="lbl">Atividades cumpridas · semana ${r}</div>${ACT.map((a,i)=>{const k=L.filter(s=>mk(s.id,r)[i]!=="0").length;return rowBar(a[0]+" "+a[1],k,n,`${k}/${n} · ${n?Math.round(k/n*100):0}%`)}).join("")}${kr?`<div class="mu" style="margin-top:6px">📖 ${kr} usaram a recuperação por leitura nesta semana.</div>`:""}</div>`;
  const low=L.filter(s=>pts(s.id,r)<=4).sort((a,b)=>pts(a.id,r)-pts(b.id,r)||a.n.localeCompare(b.n));
  h+=`<div class="card"><div class="lbl">⚠️ Precisam de incentivo · semana ${r} (4 ou menos)</div>${low.length?`<table>${low.map(s=>`<tr><td>${s.n}</td><td class="mu">${s.t}</td><td class="n">${started(s.id)?"":'<span class="tag">nunca entrou</span> '}<b>${pts(s.id,r)}</b></td></tr>`).join("")}</table>`:'<div style="margin-top:8px">Ninguém nessa faixa 🎉</div>'}</div>`;
  $("v").innerHTML=h;
}

function vA(){
  $("v").innerHTML=`<input id="sq" class="search" placeholder="🔍 Buscar aluna..." autocomplete="off">
  <div class="chips">${[["n","A a Z"],["h","Maior total"],["l","Menor total"],["w","Pior na semana"]].map(x=>`<button data-so="${x[0]}" class="${x[0]===sO?"on":""}">${x[1]}</button>`).join("")}</div><div id="sl"></div>`;
  $("sq").value=q;$("sq").oninput=e=>{q=e.target.value;listA()};
  document.querySelectorAll("[data-so]").forEach(b=>b.onclick=()=>{sO=b.dataset.so;render()});
  listA();
}
function listA(){
  const r=ref();
  let l=fil().filter(s=>norm(s.n).includes(norm(q)));
  l.sort((a,b)=>sO==="h"?tot(b.id)-tot(a.id):sO==="l"?tot(a.id)-tot(b.id):sO==="w"?pts(a.id,r)-pts(b.id,r):a.n.localeCompare(b.n));
  $("sl").innerHTML=l.length?l.map(s=>{
    const p=pts(s.id,r),pv=r>1?pts(s.id,r-1):p;
    const tr=p>pv?'<span style="color:var(--ac)">▲</span>':p<pv?'<span style="color:var(--red)">▼</span>':"";
    let h=`<div class="card st" data-o="${s.id}"><div class="hd"><span>${({g:"🟢",y:"🟡",r:"🔴"})[cls(p)]} <b>${s.n}</b> <span class="mu">· ${s.t}</span> ${tr} ${started(s.id)?"":'<span class="tag">nunca entrou</span>'}</span><span style="white-space:nowrap"><b style="font-size:19px">${tot(s.id)}</b><span class="mu">/70</span></span></div>
    <div class="sp">${W.map(w=>{const v=pts(s.id,w);return `<i class="${v?cls(v):""}" style="height:${Math.max(v*10,6)}%"></i>`}).join("")}</div>
    <div class="sn">${W.map(w=>`<span>S${w}<br><b>${pts(s.id,w)}</b></span>`).join("")}</div>`;
    if(open===s.id){
      h+=`<div class="scroll" style="margin-top:12px"><table>${W.map(w=>{const m=mk(s.id,w);return `<tr><td><b>S${w}</b></td><td>${ACT.map((a,i)=>`<span class="ai ${m[i]!=="0"?"on":""}" title="${a[1]}">${a[0]}</span>`).join("")}</td><td class="mu">📖 +${rec(s.id,w)}</td><td class="n"><b>${pts(s.id,w)}</b></td></tr>`}).join("")}</table></div>
      <div class="mu" style="margin-top:6px">${ACT.map(a=>a[0]+" "+a[1]).join(" · ")}${upd[s.id]?`<br>Última atualização: ${new Date(upd[s.id]).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`:""}</div>`;
    }
    return h+"</div>";
  }).join(""):'<div class="card mu">Nenhuma aluna encontrada.</div>';
  document.querySelectorAll("[data-o]").forEach(c=>c.onclick=()=>{open=open===c.dataset.o?null:c.dataset.o;listA()});
}

function vR(){
  const rows=fil().map(s=>({s,p:rWk==="geral"?tot(s.id):pts(s.id,rWk)})).sort((a,b)=>b.p-a.p||a.s.n.localeCompare(b.s.n));
  let h=`<div class="chips">${["geral",...W].map(w=>`<button data-k="${w}" class="${w==rWk?"on":""}">${w==="geral"?"🏆 Geral":"Semana "+w}</button>`).join("")}</div>
  <div class="card"><div class="lbl">${rWk==="geral"?"Ranking geral (máx. 70)":"Ranking da semana "+rWk+" (máx. 10)"}</div>
  <div class="prz">${rWk==="geral"?"🥇 1º lugar: 50% de desconto · 🥈 2º lugar: 50% para presentear alguém":"🎁 "+PR[rWk-1]}</div><table><tr><th></th><th>Aluna</th><th>Turma</th><th class="n">Sementes</th></tr>`;
  let pos=0,last=null;
  h+=rows.map((r,i)=>{if(r.p!==last){pos=i+1;last=r.p}const m=r.p>0&&pos===1?"🥇":r.p>0&&pos===2?"🥈":r.p>0&&pos===3?"🥉":pos;
    return `<tr class="${pos===1&&r.p>0?"top":""}"><td class="pos">${m}</td><td>${r.s.n}</td><td class="mu">${r.s.t}</td><td class="n"><b>${r.p}</b></td></tr>`}).join("");
  h+="</table></div>";
  if(rWk==="geral")h+=`<div class="card"><div class="lbl">Consolidação por semana</div><div class="scroll"><table><tr><th>Aluna</th>${W.map(w=>`<th class="n">S${w}</th>`).join("")}<th class="n">Total</th></tr>${rows.map(r=>`<tr><td>${r.s.n}</td>${W.map(w=>`<td class="n">${pts(r.s.id,w)}</td>`).join("")}<td class="n"><b>${r.p}</b></td></tr>`).join("")}</table></div>
    <button class="btn" id="csv">⬇ Baixar planilha (CSV para Excel)</button></div>`;
  $("v").innerHTML=h;
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{rWk=b.dataset.k==="geral"?"geral":+b.dataset.k;render()});
  const c=$("csv");if(c)c.onclick=()=>{
    const L=["Aluna;Turma;S1;S2;S3;S4;S5;S6;S7;Total",...rows.map(r=>[r.s.n,r.s.t,...W.map(w=>pts(r.s.id,w)),r.p].join(";"))];
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+L.join("\n")],{type:"text/csv;charset=utf-8"}));
    a.download="ranking-sementes.csv";document.body.appendChild(a);a.click();a.remove();
  };
}

/* ===================== DADOS (SUPABASE) ===================== */
async function carregar(){
  const {data:rows,error}=await sb.from(CFG.tabela).select("id,dados,updated_at");
  if(error)throw error;
  rows.forEach(r=>{upd[r.id]=r.updated_at;if(Date.now()-(lastSave[r.id]||0)>5000)data[r.id]=r.dados||{}});
  ok=true;lastUpd=new Date();$("warn").innerHTML="";
}

render();
(async()=>{
  try{
    sb=supabase.createClient(CFG.url,CFG.key);
    await carregar();
  }catch(e){
    ok=false;$("warn").innerHTML='<div class="warn">⚠️ Não foi possível conectar. Verifique sua internet e recarregue a página.</div>';
  }
  ready=true;render();
  if(!sb)return;
  sb.channel("sementes").on("postgres_changes",{event:"*",schema:"public",table:CFG.tabela},p=>{
    const r=p.new;if(!r||!r.id)return;
    upd[r.id]=r.updated_at;lastUpd=new Date();
    if(Date.now()-(lastSave[r.id]||0)>5000){data[r.id]=r.dados||{};if(mode==="aluna"||mode==="lider")render()}
  }).subscribe(st=>{if(st==="SUBSCRIBED"){ok=true;if(mode==="lider")header()}});
  setInterval(()=>{if(mode==="lider")carregar().then(render).catch(()=>{ok=false;header()})},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)carregar().then(render).catch(()=>{})});
})();
</script>
</body>
